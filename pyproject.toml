[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sottovoce"
version = "0.1.0"
description = "Audio description that fits the pauses and checks its own facts, with vision models on AMD Instinct GPUs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]>=2.11",
    "litellm>=1.105",
    "faster-whisper>=1.2",
    "google-cloud-texttospeech>=2.38",
    "numpy>=1.26",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sottovoce"]

[tool.setuptools.package-data]
sottovoce = ["web/*", "web/app/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
