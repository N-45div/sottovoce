[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sottovoce"
version = "0.1.0"
description = "Audio description for video, written to fit the pauses and checked against the frames, on one AMD Instinct GPU."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.11",
    "litellm>=1.105",
    "faster-whisper>=1.2",
    "google-cloud-texttospeech>=2.38",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sottovoce"]

[tool.setuptools.package-data]
sottovoce = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
